# Static checks and unit tests on every push to main and PR.
#
# The matrix is the floor, the active LTS, and the next line: Node 22 is what
# package.json promises to support, 24 is what most people are on, and 26 is the
# early warning. The day the floor can move is a green check rather than a guess.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The package is installed by strangers via npx, so what actually ships is
  # worth checking: it must build, and the bin it declares must exist and run.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js --version
      # Not just "the file exists": this spawns the built bin exactly as an MCP
      # host does and completes a real handshake. The unit suite runs against an
      # in-memory transport, so it cannot catch a broken shebang, a bad bin
      # entry, or a stray write to stdout corrupting the JSON-RPC stream.
      - run: npm run smoke
      - run: npm pack --dry-run
