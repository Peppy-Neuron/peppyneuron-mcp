# release-please keeps a release PR open on main, accumulating conventional
# commits into a changelog and version bump. Merging that PR creates the GitHub
# release and tag, which publishes to npm (publish.yml).

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
