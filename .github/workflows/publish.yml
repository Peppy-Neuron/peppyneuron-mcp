# Publishes to npm when release-please cuts a release.
#
# Called by release-please.yml rather than triggered by `on: release`. That is
# not a style choice: release-please creates the GitHub release with
# GITHUB_TOKEN, and GitHub deliberately does not deliver events raised by
# GITHUB_TOKEN to other workflows (its anti-recursion rule). An `on: release`
# trigger here would leave us with a tag, a release, a changelog — and silence
# from npm, with nothing in any log saying why. Being called directly keeps the
# chain observable and needs no PAT to work around the rule.
#
# `id-token: write` plus `--provenance` attaches a signed attestation linking the
# tarball to this workflow run and this commit. For a package whose whole pitch
# is that you can audit what runs on your machine, being able to prove the
# published bytes came from this repo is part of the product, not a nicety.

name: Publish

on:
  workflow_call:
  # Kept so a failed or skipped publish can be re-run by hand without cutting a
  # second release.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The release gate must include the check that exercises the ARTEFACT, not
      # just the sources. The unit suite runs over an in-memory transport and
      # cannot see a broken shebang, a bad bin entry, or a stray write to stdout
      # corrupting the JSON-RPC stream — all of which ship silently and break
      # every host that installs us.
      - run: npm run smoke

      # The stimulus is the experiment's independent variable. A release that
      # changes it while a phase-0 window is open invalidates the run
      # (PHASE0-CRITERION §6), so the byte-stability test above is a release
      # gate, not only a unit test.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
